[project]
  name            = "timeclock-backend"
  version         = "0.1.0"
  description     = "The time clocks' server side: the Coolify tunnel endpoint now; the database relay, PostgreSQL and the scheduler later"
  readme          = "README.md"
  requires-python = ">=3.14"
  dependencies    = [
    "aeth-ext>=9.0.2",
    "devkit-container>=2.2.0",
  ]

  [project.scripts]
    run-app-timeclock-backend = "timeclock_backend.__main__:run_app"

[dependency-groups]
  dev = [
    "aeth-devkit>=15.1.1",
  ]

[build-system]
  requires      = ["uv_build>=0.11.2,<0.12.0"]
  build-backend = "uv_build"

[tool.docker]
  # The tunnel service in docker/compose.yaml is deliberately unlisted: its own Dockerfile, no devkit-container.
  services                = ["timeclock-backend"]
  required_persisted_dirs = ["persisted_data"]
  supervise               = false
  wireguard               = false

[tool.uv]
  [tool.uv.sources]
    aeth-devkit      = [{ index = "SFTPyPI" }]
    aeth-ext         = [{ index = "SFTPyPI" }]
    devkit-container = [{ index = "SFTPyPI" }]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
