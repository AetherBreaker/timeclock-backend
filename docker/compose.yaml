services:
  timeclock-backend:
    container_name: timeclock-backend
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_REPO: https://github.com/AetherBreaker/timeclock-backend.git
        GIT_TAG: v0.1.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: /data/timeclock_backend_files
        target: /app/persisted_data
    environment:
      - HEARTBEAT_SLUG=timeclock-backend
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  coolify:
    external: true
