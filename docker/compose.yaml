services:
  timeclock-backend:
    container_name: timeclock-backend
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_REPO: https://github.com/AetherBreaker/timeclock-backend.git
        GIT_TAG: v0.1.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: /data/timeclock_backend_files
        target: /app/persisted_data
    environment:
      - HEARTBEAT_SLUG=timeclock-backend
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

  # Not in [tool.docker].services: built from this checkout with its own Dockerfile. The clocks dial
  # port 2223; Coolify reaches each clock at timeclock-tunnel:<its port> over the coolify network.
  timeclock-tunnel:
    container_name: timeclock-tunnel
    build:
      context: .
      dockerfile: docker/tunnel/Dockerfile
    restart: unless-stopped
    environment:
      - TUNNEL_SSH_HOST_KEY_B64=${TUNNEL_SSH_HOST_KEY_B64:?}
    ports:
      - "2223:22"
    networks:
      - coolify

networks:
  coolify:
    external: true
